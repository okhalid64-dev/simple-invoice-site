# Secret scanning on every push and PR. Fails the check if a credential-shaped string lands
# in the diff (API keys, private keys, tokens, keystore passwords). Full history is scanned
# once per run so a secret that slipped in earlier is caught too.
name: secret-scan
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        # The CLI directly: no GitHub API calls, no licence lookup, pinned version.
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks git --no-banner --redact --exit-code 1 .